<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Orçamento do Serviço Automotivo">
  <meta property="og:description" content="Consulte os detalhes do seu orçamento.">
  <meta property="og:image" content="">
  <meta name="twitter:card" content="summary">
  <title>Orçamento do Serviço Automotivo</title>
  <link rel="stylesheet" href="style.css?v=120">
</head>
<body data-page="orcamento-publico" class="print-preview-page public-budget-page">
  <div class="print-toolbar">
    <button class="btn btn-primary" type="button" id="printButton">Imprimir / Salvar PDF</button>
  </div>
  <section class="public-budget-decision" id="publicBudgetDecision" hidden aria-live="polite">
    <div id="publicBudgetDecisionPrompt">
      <span>Este orçamento atende ao que você precisa?</span>
      <strong>Indique sua decisão para a oficina</strong>
      <div class="public-budget-decision-actions">
        <button class="btn btn-primary" type="button" data-public-response="approved">Aprovar</button>
        <button class="btn btn-danger" type="button" data-public-response="rejected">Não aprovado</button>
      </div>
      <small>Esta é uma indicação. A oficina fará a confirmação final no sistema.</small>
    </div>
    <div class="public-budget-decision-result" id="publicBudgetDecisionResult" hidden></div>
  </section>
  <main id="printRoot"></main>
  <script src="assets/qrcode-generator.min.js?v=1"></script>
  <script src="script.js?v=104"></script>
  <script src="firebase-config.js?v=13"></script>
  <script type="module" src="firebase-public.js?v=3"></script>
</body>
</html>
